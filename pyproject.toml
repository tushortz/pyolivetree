[project]
name = "pyolivetree"
version = "1.0.0"
description = "Python client for the Olive Tree Bible Reader API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "pyolivetree contributors" }]
keywords = ["olivetree", "bible", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "build>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/pyolivetree/pyolivetree"
Documentation = "https://github.com/pyolivetree/pyolivetree#readme"
Repository = "https://github.com/pyolivetree/pyolivetree"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyolivetree"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    "examples",
    "integration",
    "scripts",
    "results",
    "biblereader.olivetree",
    "env",
    ".venv",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_swagger.py" = ["E501"]
"src/pyolivetree/_operations.py" = ["E501"]
"src/pyolivetree/resources/*.py" = ["E501"]
"src/pyolivetree/models/*.py" = ["E501"]
"scripts/run_integration.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=pyolivetree --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["pyolivetree"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
