[project]
name = "pyolivetree"
version = "2.0.1"
description = "Python client for the Olive Tree Bible app APIs: notes, highlights, library, Smart Search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Taiwo Kareem" }]
keywords = ["olivetree", "bible", "bible-study", "notes", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Religion",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/tushortz/pyolivetree"
Repository = "https://github.com/tushortz/pyolivetree"
Issues = "https://github.com/tushortz/pyolivetree/issues"
Changelog = "https://github.com/tushortz/pyolivetree/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "black>=24", "build>=1.2", "twine>=5"]
docs = ["sphinx>=7", "furo>=2024.1"]

[project.scripts]
pyolivetree = "pyolivetree.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyolivetree"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
