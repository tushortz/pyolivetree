openapi: 3.0.3
info:
  title: Olive Tree Bible Reader API
  description: 'Reverse-engineered OpenAPI specification from the decompiled Olive Tree Bible Reader Android client (biblereader.olivetree).


    **Limitations:**

    - Request/response shapes reflect client expectations; servers may accept additional fields.

    - Dynamic store paths (resource guide, RC sections) use server-driven URL suffixes.

    - HMAC `signature` header requires device-specific key from otTelemetry/HMACVerification.

    - DRM license URLs are fetched dynamically from media manifests.

    - Most store endpoints use POST with application/x-www-form-urlencoded bodies.

    '
  version: 1.0.0
  contact:
    name: Olive Tree
    url: https://www.olivetree.com
servers:
- url: https://www.olivetree.com
  description: Main store, account, legacy API, messages
- url: https://sync.olivetree.com
  description: Annotation/library sync
- url: https://biblesearch-ai.olivetree.com
  description: Smart Search AI (production)
- url: https://staging-biblesearch-ai.olivetree.com
  description: Smart Search AI (staging)
- url: https://analytics.olivetree.com
  description: Event analytics
- url: https://privacy.olivetree.com
  description: Privacy, consent, telemetry
- url: https://speech.olivetree.com
  description: Audio reading plan TTS
- url: https://votd.olivetree.com
  description: Verse of the Day images
- url: https://cdn.olivetree.com
  description: Static CDN assets
- url: https://media.olivetree.com
  description: Legacy media images
- url: https://admin.olivetree.com
  description: Internal admin API
- url: https://help.olivetree.com
  description: Help center (browser)
- url: https://biblereader-android-df00f.firebaseio.com
  description: Firebase Realtime Database
tags:
- name: Store
  description: Store JSON API (/store/br5/app/json/store/)
- name: Account
  description: Account authentication (/store/br5/app/json/account/)
- name: StoreXML
  description: Legacy XML store API (/store/br5/app/in-app/xml/)
- name: Legacy
  description: Legacy PHP API (/api/)
- name: Messages
  description: In-app messaging (/api/messages/v1/)
- name: SmartSearch
  description: AI-powered Bible search
- name: Sync
  description: Annotation and library sync
- name: Analytics
  description: Event analytics and A/B testing
- name: Privacy
  description: Privacy, consent, and telemetry
- name: Speech
  description: TTS audio for reading plans
- name: VOTD
  description: Verse of the Day
- name: CDN
  description: Static CDN assets
- name: Media
  description: Legacy media host
- name: Static
  description: Static JSON assets on www
- name: Admin
  description: Internal admin endpoints
- name: Browser
  description: Browser-only redirect and web pages
- name: Firebase
  description: Firebase Realtime Database
