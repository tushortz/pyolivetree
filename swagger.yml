components:
  securitySchemes:
    OTBearerAuth:
      type: apiKey
      in: header
      name: OTAuthorization
      description: 'Bearer access or refresh token. Format: `Bearer {authentication_token}`'
    BasicAuth:
      type: http
      scheme: basic
      description: Fallback Basic auth with olivetree.com credentials (base64 user:pass)
    HMACSignature:
      type: apiKey
      in: header
      name: signature
      description: HMAC hex digest of raw request body. Key derived from device telemetry.
